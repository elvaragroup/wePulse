name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      # No ANTHROPIC_API_KEY is set anywhere in this workflow. Every test uses
      # FakeLLMClient (spec 6); a test that needs a real key does not belong here.
      - name: Run tests
        run: uv run pytest
